[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pylogkit"
version = "0.1.0"
description = "A structured and colourised logging toolkit for Python applications"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mark Bacon" }]
keywords = ["logging", "structured logging", "json", "colour", "syslog"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Logging",
]
dependencies = ["colorlog>=6.0.0"]

[project.optional-dependencies]
json = ["python-json-logger>=2.0.7"]
progress = ["tqdm"]
all = ["pylogkit[json,progress]"]
dev = ["pytest>=7", "pytest-cov", "ruff", "mypy", "build"]

[project.urls]
Homepage = "https://github.com/markbac/py-logkit"
Issues = "https://github.com/markbac/py-logkit/issues"
Changelog = "https://github.com/markbac/py-logkit/blob/main/CHANGELOG.md"

[tool.setuptools.package-data]
pylogkit = ["py.typed"]

[tool.setuptools.packages.find]
include = ["pylogkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "json_logger: needs the optional python-json-logger package",
    "extras: needs every optional extra (json and progress) installed",
]

[tool.coverage.run]
source = ["pylogkit"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
# Keep hand-written layout (such as aligned comments) in documentation examples.
exclude = ["*.md"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pep8-naming, pyupgrade, bugbear and pydocstyle.
select = ["E", "W", "F", "I", "N", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["pylogkit"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["tqdm", "colorlog", "colorlog.*", "pythonjsonlogger", "pythonjsonlogger.*"]
ignore_missing_imports = true
